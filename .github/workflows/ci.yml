name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter react-native-nativescope build
      - run: pnpm --filter @rnsi/site build
      - name: Published package is self-contained
        working-directory: apps/cli
        run: |
          tarball=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --silent)
          tar -tzf "$RUNNER_TEMP/$tarball" | grep -q '^package/dist/ui/index.html$'
          tar -xOf "$RUNNER_TEMP/$tarball" package/package.json > "$RUNNER_TEMP/nativescope-package.json"
          if grep -q 'workspace:' "$RUNNER_TEMP/nativescope-package.json"; then
            echo "published package contains a workspace dependency" >&2
            exit 1
          fi
          mkdir "$RUNNER_TEMP/nativescope-consumer"
          cd "$RUNNER_TEMP/nativescope-consumer"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP/$tarball" --ignore-scripts --no-audit --no-fund
          test -x node_modules/.bin/nativescope

          node_modules/.bin/nativescope --fake --no-open --port 4789 >nativescope.log 2>&1 &
          nativescope_pid=$!
          trap 'kill "$nativescope_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --output studio.html http://127.0.0.1:4789/; then
              break
            fi
            sleep 0.25
          done
          test -s studio.html
          grep -q '<div id="root"></div>' studio.html
      - name: D5 — Studio is a pure web client (zero @tauri-apps)
        run: |
          if grep -rn "@tauri-apps" apps/desktop/src; then
            echo "D5 violation: the Studio cannot import @tauri-apps" >&2
            exit 1
          fi
          echo "No @tauri-apps imports in the Studio"

  # Prevent instrumentation shims from leaking into production bundles.
  release-bundle-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter react-native-nativescope build
      - name: Install playground deps
        working-directory: apps/playground
        run: npm ci --no-audit --no-fund
      - name: Export release bundle
        working-directory: apps/playground
        run: npx expo export --platform android --output-dir dist
      - name: Scan bundle for shim leakage
        run: |
          shopt -s globstar nullglob
          bundles=(apps/playground/dist/**/*.js apps/playground/dist/**/*.hbc)
          if [ ${#bundles[@]} -eq 0 ]; then
            echo "no release bundle found" >&2
            exit 1
          fi
          node scripts/check-release-bundle.mjs "${bundles[@]}"
