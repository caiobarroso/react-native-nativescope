packages:
  - "apps/*"
  # Intentionally outside the workspace: Metro and pnpm symlinks still create
  # friction. The playground installs its own dependencies with npm.
  - "!apps/playground"
  - "packages/*"

linkWorkspacePackages: true
preferWorkspacePackages: true

overrides:
  "postcss@<8.5.10": "8.5.19"

onlyBuiltDependencies:
  - esbuild
